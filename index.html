<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de projets</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--accent:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--grey:#aeaeb2;--line:#e5e5ea}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--line:#38383a}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 100px}
  h1{font-size:28px;margin:8px 0 16px}
  h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px;font-weight:600}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border-radius:14px;padding:14px}
  .kpi .v{font-size:30px;font-weight:700}
  .kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{font-weight:600;font-size:17px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
  .tabbar button{flex:1;background:none;border:0;font-size:12px;color:var(--muted);padding:6px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .tabbar .ic{display:block;font-size:22px}
  button.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;width:100%}
  button.ghost{background:none;border:0;color:var(--accent);font-size:16px;padding:6px 0}
  button.danger{background:none;border:0;color:var(--red);font-size:16px;padding:10px 0}
  input,select,textarea{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px;font-family:inherit}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 4px 2px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--text)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .task input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
  .task.done .t{text-decoration:line-through;color:var(--muted)}
  .late{color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .note{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
  .note small{color:var(--muted);display:block}
  svg{display:block;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabbar" id="tabbar"></div>

<script>
const KEY='suivi_projets_v1';
const STATUTS={idee:['Idée','#aeaeb2'],cours:['En cours','#007aff'],pause:['En pause','#ff9500'],termine:['Terminé','#34c759']};
const PRIO={1:'Haute',2:'Moyenne',3:'Basse'};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{projets:[]};
let view='dash',filtre='tous',curId=null;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>s?new Date(s+'T00:00:00'):null;
const fmt=s=>s?parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const avance=p=>{if(p.taches&&p.taches.length)return Math.round(p.taches.filter(t=>t.fait).length/p.taches.length*100);return p.avancement||0};
const enRetard=p=>p.statut!=='termine'&&p.echeance&&parse(p.echeance)<today();
const tacheRetard=t=>!t.fait&&t.echeance&&parse(t.echeance)<today();
const proj=id=>db.projets.find(p=>p.id===id);

function go(v,id){view=v;curId=id||null;render();window.scrollTo(0,0)}
function tabs(){
  const t=[['dash','📊','Tableau'],['list','📁','Projets'],['set','⚙️','Réglages']];
  document.getElementById('tabbar').innerHTML=t.map(([k,i,l])=>
    `<button class="${view===k?'on':''}" onclick="go('${k}')"><span class="ic">${i}</span>${l}</button>`).join('');
}

function donut(data){
  const tot=data.reduce((a,d)=>a+d.v,0);
  if(!tot)return '<div class="empty">Aucune donnée</div>';
  let a0=-Math.PI/2,paths='';const r=50,c=60;
  data.filter(d=>d.v>0).forEach(d=>{
    if(d.v===tot){paths+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${d.c}" stroke-width="18"/>`;return}
    const a1=a0+d.v/tot*2*Math.PI;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    paths+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}" fill="none" stroke="${d.c}" stroke-width="18"/>`;
    a0=a1;
  });
  const leg=data.map(d=>`<div class="row" style="font-size:14px;margin:3px 0"><span><span style="color:${d.c}">●</span> ${d.l}</span><b>${d.v}</b></div>`).join('');
  return `<div class="row" style="gap:16px"><svg width="120" height="120" viewBox="0 0 120 120">${paths}<text x="60" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${tot}</text></svg><div style="flex:1">${leg}</div></div>`;
}

function barres(items){
  const max=Math.max(1,...items.map(i=>i.v));
  const w=300,h=110,bw=w/items.length;
  let s=`<svg width="100%" viewBox="0 0 ${w} ${h+22}">`;
  items.forEach((it,i)=>{
    const bh=it.v/max*h;
    s+=`<rect x="${i*bw+8}" y="${h-bh}" width="${bw-16}" height="${bh}" rx="5" fill="var(--accent)"/>`;
    s+=`<text x="${i*bw+bw/2}" y="${h+15}" text-anchor="middle" font-size="11" fill="#8e8e93">${it.l}</text>`;
    if(it.v)s+=`<text x="${i*bw+bw/2}" y="${h-bh-4}" text-anchor="middle" font-size="11" fill="currentColor">${it.v}</text>`;
  });
  return s+'</svg>';
}

function vDash(){
  const P=db.projets,actifs=P.filter(p=>p.statut==='cours');
  const retard=P.filter(enRetard);
  const moy=actifs.length?Math.round(actifs.reduce((a,p)=>a+avance(p),0)/actifs.length):0;
  const toutesT=P.flatMap(p=>(p.taches||[]).map(t=>({...t,p})));
  const tRetard=toutesT.filter(tacheRetard).length;
  const rep=Object.keys(STATUTS).map(k=>({l:STATUTS[k][0],c:STATUTS[k][1],v:P.filter(p=>p.statut===k).length}));
  const t0=today(),t7=new Date(t0);t7.setDate(t7.getDate()+7);
  const proches=toutesT.filter(t=>!t.fait&&t.echeance&&parse(t.echeance)<=t7).sort((a,b)=>a.echeance.localeCompare(b.echeance)).slice(0,5);
  const mois=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);mois.push({m:d.getMonth(),y:d.getFullYear(),l:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),v:0})}
  P.forEach(p=>{const d=parse((p.creation||'').slice(0,10));if(!d)return;const m=mois.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear());if(m)m.v++});
  return `<h1>Tableau de bord</h1>
  <div class="grid">
    <div class="kpi"><div class="v">${actifs.length}</div><div class="l">Projets en cours</div></div>
    <div class="kpi"><div class="v ${retard.length?'late':''}">${retard.length}</div><div class="l">Projets en retard</div></div>
    <div class="kpi"><div class="v">${moy}%</div><div class="l">Avancement moyen</div><div class="bar"><i style="width:${moy}%"></i></div></div>
    <div class="kpi"><div class="v ${tRetard?'late':''}">${tRetard}</div><div class="l">Tâches en retard</div></div>
  </div>
  <h2>Répartition</h2><div class="card">${donut(rep)}</div>
  <h2>À venir (7 jours)</h2><div class="card">${proches.length?proches.map(t=>`<div class="task" onclick="go('detail','${t.p.id}')"><div style="flex:1"><div class="t">${esc(t.titre)}</div><div class="sub">${esc(t.p.nom)}</div></div><div class="${tacheRetard(t)?'late':''}" style="font-size:14px">${fmt(t.echeance)}</div></div>`).join(''):'<div class="empty">Rien d\'urgent 🎉</div>'}</div>
  <h2>Projets créés (6 mois)</h2><div class="card">${barres(mois)}</div>`;
}

function vList(){
  let L=[...db.projets];
  if(filtre!=='tous')L=L.filter(p=>p.statut===filtre);
  L.sort((a,b)=>(a.priorite-b.priorite)||((a.echeance||'9999').localeCompare(b.echeance||'9999')));
  const chips=[['tous','Tous'],...Object.entries(STATUTS).map(([k,v])=>[k,v[0]])]
    .map(([k,l])=>`<div class="chip ${filtre===k?'on':''}" onclick="filtre='${k}';render()">${l}</div>`).join('');
  return `<div class="row"><h1>Projets</h1><button class="ghost" onclick="go('form')">+ Nouveau</button></div>
  <div class="chips">${chips}</div>
  ${L.length?L.map(p=>{const av=avance(p);return `<div class="card" onclick="go('detail','${p.id}')">
    <div class="row"><div class="title">${esc(p.nom)}</div><span class="badge" style="background:${STATUTS[p.statut][1]}">${STATUTS[p.statut][0]}</span></div>
    <div class="sub ${enRetard(p)?'late':''}">Priorité ${PRIO[p.priorite].toLowerCase()} · Échéance ${fmt(p.echeance)}${enRetard(p)?' · en retard':''}</div>
    <div class="bar"><i style="width:${av}%"></i></div><div class="sub">${av}%</div></div>`}).join(''):'<div class="empty">Aucun projet.<br>Touche « + Nouveau » pour commencer.</div>'}`;
}

function vForm(){
  const p=curId?proj(curId):{nom:'',description:'',statut:'idee',priorite:2,echeance:''};
  const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${String(k)===String(sel)?'selected':''}>${Array.isArray(v)?v[0]:v}</option>`).join('');
  return `<div class="row"><button class="ghost" onclick="go(${curId?`'detail','${curId}'`:`'list'`})">‹ Retour</button></div>
  <h1>${curId?'Modifier':'Nouveau projet'}</h1>
  <label>Nom</label><input id="f_nom" value="${esc(p.nom)}" placeholder="Nom du projet">
  <label>Description</label><textarea id="f_desc" rows="3">${esc(p.description)}</textarea>
  <label>Statut</label><select id="f_statut">${opts(STATUTS,p.statut)}</select>
  <label>Priorité</label><select id="f_prio">${opts(PRIO,p.priorite)}</select>
  <label>Échéance</label><input id="f_ech" type="date" value="${p.echeance||''}">
  <button class="primary" onclick="saveForm()">Enregistrer</button>`;
}
function saveForm(){
  const nom=document.getElementById('f_nom').value.trim();
  if(!nom){alert('Donne un nom au projet');return}
  const d={nom,description:document.getElementById('f_desc').value,statut:document.getElementById('f_statut').value,
    priorite:+document.getElementById('f_prio').value,echeance:document.getElementById('f_ech').value};
  if(curId){Object.assign(proj(curId),d);go('detail',curId)}
  else{const p={id:uid(),...d,taches:[],notes:[],avancement:0,creation:new Date().toISOString()};db.projets.push(p);save();return go('detail',p.id)}
  save();
}

function vDetail(){
  const p=proj(curId);if(!p)return go('list');
  const av=avance(p),hasT=p.taches.length>0;
  return `<div class="row"><button class="ghost" onclick="go('list')">‹ Projets</button><button class="ghost" onclick="go('form','${p.id}')">Modifier</button></div>
  <h1>${esc(p.nom)}</h1>
  <div class="card">
    <div class="row"><span class="badge" style="background:${STATUTS[p.statut][1]}">${STATUTS[p.statut][0]}</span><span class="sub ${enRetard(p)?'late':''}">Échéance ${fmt(p.echeance)}</span></div>
    ${p.description?`<p style="margin:12px 0 0">${esc(p.description)}</p>`:''}
    <div class="bar" style="margin-top:14px"><i style="width:${av}%"></i></div><div class="sub">Avancement ${av}%${hasT?' (calculé depuis les tâches)':''}</div>
    ${hasT?'':`<input type="range" min="0" max="100" value="${p.avancement}" oninput="setAv('${p.id}',this.value)" style="margin-top:10px;padding:0">`}
  </div>
  <h2>Tâches (${p.taches.filter(t=>t.fait).length}/${p.taches.length})</h2>
  <div class="card">
    ${p.taches.map(t=>`<div class="task ${t.fait?'done':''}">
      <input type="checkbox" ${t.fait?'checked':''} onchange="toggleT('${p.id}','${t.id}')">
      <div style="flex:1"><div class="t">${esc(t.titre)}</div>${t.echeance?`<div class="sub ${tacheRetard(t)?'late':''}">${fmt(t.echeance)}</div>`:''}</div>
      <button class="ghost" style="color:var(--red)" onclick="delT('${p.id}','${t.id}')">✕</button></div>`).join('')||'<div class="sub">Aucune tâche</div>'}
    <div style="margin-top:12px"><input id="t_titre" placeholder="Nouvelle tâche"><input id="t_ech" type="date"><button class="primary" onclick="addT('${p.id}')">Ajouter la tâche</button></div>
  </div>
  <h2>Notes</h2>
  <div class="card">
    ${p.notes.slice().reverse().map(n=>`<div class="note"><small>${new Date(n.date).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small>${esc(n.texte)}</div>`).join('')||'<div class="sub">Aucune note</div>'}
    <div style="margin-top:12px"><textarea id="n_txt" rows="2" placeholder="Ajouter une note"></textarea><button class="primary" onclick="addN('${p.id}')">Ajouter la note</button></div>
  </div>
  <button class="danger" onclick="delP('${p.id}')">Supprimer ce projet</button>`;
}
function setAv(id,v){proj(id).avancement=+v;save()}
function addT(id){const t=document.getElementById('t_titre').value.trim();if(!t)return;
  proj(id).taches.push({id:uid(),titre:t,echeance:document.getElementById('t_ech').value,fait:false});save();render()}
function toggleT(id,tid){const t=proj(id).taches.find(x=>x.id===tid);t.fait=!t.fait;save();render()}
function delT(id,tid){const p=proj(id);p.taches=p.taches.filter(x=>x.id!==tid);save();render()}
function addN(id){const t=document.getElementById('n_txt').value.trim();if(!t)return;
  proj(id).notes.push({texte:t,date:new Date().toISOString()});save();render()}
function delP(id){if(confirm('Supprimer ce projet ?')){db.projets=db.projets.filter(p=>p.id!==id);save();go('list')}}

function vSet(){
  return `<h1>Réglages</h1>
  <div class="card"><div class="title">Sauvegarde</div>
  <p class="sub">Tes données restent sur cet appareil. Exporte-les régulièrement.</p>
  <button class="primary" onclick="exportJ()" style="margin-bottom:10px">Exporter (JSON)</button>
  <label style="margin-top:6px">Importer un fichier</label>
  <input type="file" accept=".json,application/json" onchange="importJ(this.files[0])"></div>
  <div class="card"><div class="title">Données de démonstration</div>
  <p class="sub">Ajoute 3 projets d'exemple pour visualiser le tableau de bord.</p>
  <button class="primary" onclick="demo()">Charger la démo</button></div>
  <div class="card"><button class="danger" onclick="if(confirm('Tout effacer ?')){db={projets:[]};save();go('dash')}">Effacer toutes les données</button></div>`;
}
function exportJ(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='suivi-projets.json';a.click();
}
function importJ(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projets))throw 0;db=d;save();alert('Import réussi');go('dash')}catch(e){alert('Fichier invalide')}};
  r.readAsText(f);
}
function demo(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  const iso=n=>{const x=new Date();x.setMonth(x.getMonth()-n);return x.toISOString()};
  db.projets.push(
    {id:uid(),nom:'Refonte du site web',description:'Nouvelle version du site vitrine',statut:'cours',priorite:1,echeance:d(12),creation:iso(1),avancement:0,notes:[{texte:'Maquettes validées',date:new Date().toISOString()}],
      taches:[{id:uid(),titre:'Maquettes',echeance:d(-3),fait:true},{id:uid(),titre:'Développement',echeance:d(5),fait:false},{id:uid(),titre:'Recette',echeance:d(-1),fait:false},{id:uid(),titre:'Mise en ligne',echeance:d(12),fait:false}]},
    {id:uid(),nom:'Lancement newsletter',description:'',statut:'cours',priorite:2,echeance:d(-4),creation:iso(2),avancement:60,notes:[],taches:[]},
    {id:uid(),nom:'Étude de marché',description:'',statut:'idee',priorite:3,echeance:d(30),creation:iso(0),avancement:0,notes:[],taches:[]}
  );
  save();go('dash');
}

function render(){
  const v={dash:vDash,list:vList,form:vForm,detail:vDetail,set:vSet}[view];
  document.getElementById('app').innerHTML=v();
  tabs();
}
render();
</script>
</body>
</html>
